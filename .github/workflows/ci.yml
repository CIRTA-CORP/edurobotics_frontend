name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edurobotics_frontend/frontend-react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: edurobotics_frontend/frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Non-blocking for now: `eslint .` reports ~57 pre-existing issues (config
      # files, unused vars). Build is the real gate. Flip to blocking after a
      # dedicated lint cleanup (F6 / ux-a11y-pass).
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
